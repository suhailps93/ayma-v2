name: ayma_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.30.0+2433
environment:
  sdk: ^3.13.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  go_router: ^17.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  # Direct dep for DefaultCacheManager (the image viewer's share/download
  # pulls bytes out of the same cache cached_network_image fills) — already
  # in the tree transitively via cached_network_image.
  flutter_cache_manager: ^3.4.1
  google_fonts: ^6.3.2
  http: ^1.6.0
  # Startup resilience (splash §11.2): retry /bootstrap the moment the network
  # comes back. Already in the tree transitively via livekit_client; declared
  # directly so the splash can import it — no new download/weight.
  connectivity_plus: ^7.3.1
  livekit_client: ^2.6.4
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  firebase_messaging: ^16.6.0
  url_launcher: ^6.3.2
  country_picker: ^2.0.26
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  just_audio: ^0.10.6
  file_picker: ^8.3.7
  wakelock_plus: ^1.4.0
  permission_handler: ^13.0.2
  firebase_crashlytics: ^5.4.0
  package_info_plus: ^9.0.0
  share_plus: ^12.0.2
  purchases_flutter: ^10.17.0
  sentry_flutter: ^10.2.0
  record: ^7.1.2
  path_provider: ^2.1.6

# permission_handler 13.0.2 pulls permission_handler_android ^14.1.0, whose
# published android/build.gradle.kts (14.0.0 and 14.1.0 alike) is broken: it
# declares a Kotlin Gradle Plugin classpath but never applies
# org.jetbrains.kotlin.android/.jvm, so the file's own `kotlin { compilerOptions
# { ... } } ` block fails to resolve at Gradle config time (independent of any
# app code — reproduces from a clean checkout with these plugin versions).
# Pinned to 13.0.1, the last release built as a plain Groovy build.gradle with
# no Kotlin DSL block, which we've verified compiles clean.
dependency_overrides:
  permission_handler_android: 13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  firebase_auth_mocks: ^0.15.2
  # Tests hand flutter_cache_manager fakes package:file-typed files (its API
  # speaks that File type, not dart:io's) — already in the tree transitively.
  file: ^7.0.1
  fake_cloud_firestore: ^4.1.1
  flutter_launcher_icons: ^0.14.4

# 2026-10-20: launcher icons show only the orb (no cream/black frame). After
# the test generator below, run `python3 tool/build_icon_variants.py` to derive
# the per-platform sources referenced in this config.
# Ayma Sol app icon (dev-tool config, not a runtime asset list) — the
# voice-live frame rendered straight from AymaOrbPainter by
# tool/generate_app_icon_test.dart (founder ruling 2026-11-05: the launcher
# icon is the orb as it looks during a live voice call; nothing in-app
# changes — ayma_orb_ios.png stays the resting-orb in-app mark, the iOS
# launcher art lives in ayma_orb_ios_launcher.png). Regenerate with:
#   flutter test tool/generate_app_icon_test.dart
#   python3 tool/build_icon_variants.py
#   dart run flutter_launcher_icons
#   python3 tool/build_icon_variants.py   # re-stamp opaque round icons
#
# Root cause of the "black ring" bug (2026-09-13): the generator tool below
# already insets the orb to 72% of its 1024x1024 canvas so the launcher's own
# adaptive-icon mask never clips it — but flutter_launcher_icons' default
# `adaptive_icon_foreground_inset` is 16%, which was applying a *second*,
# compounding inset on top of that, shrinking the visible orb to ~49% of the
# canvas versus the ~61-66% the OS mask actually reveals. The gap between
# those two circles exposed a wide ring of the flat adaptive-icon background
# color — which read as a harsh black ring because that background was
# `#131210` (== AymaColors.darkBg, chosen for in-app contrast, not for a
# from-space brand mark). Fixed by zeroing the plugin's extra inset (the
# source image is already correctly padded) and swapping the background for
# the app's warm cream light-theme tone, matching the founder's reference
# hero image ("soft cream space", no hard outline).
flutter_launcher_icons:
  image_path: "assets/icon/ayma_sol_icon.png"
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/ayma_orb_android_bg.png"
  adaptive_icon_foreground: "assets/icon/ayma_orb_android_fg.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/ayma_orb_android_mono.png"
  image_path_android: "assets/icon/ayma_orb_android_legacy.png"
  image_path_ios: "assets/icon/ayma_orb_ios_launcher.png"
  ios: true
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600

  assets:
    - assets/icon/
    # Self-hosted Google Fonts (InstrumentSerif-Regular, JetBrainsMono-Medium).
    # Bundled so google_fonts resolves them from assets instead of fetching at
    # runtime — required because the test suite sets
    # GoogleFonts.config.allowRuntimeFetching = false (no network on CI). Files
    # are named by google_fonts' asset-lookup convention (<Family>-<Variant>.ttf);
    # SIL OFL-1.1 license text ships beside them.
    - assets/google_fonts/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
