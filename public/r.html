<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join Ayma</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
           max-width: 640px; margin: 0 auto; padding: 60px 20px 80px; line-height: 1.6; color: #1B2130; background: #F4F5F8; }
    h1 { font-size: 2.4rem; margin-bottom: 0.1em; }
    p.tagline { color: #59617A; font-size: 1.1rem; margin-top: 0; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1.6rem; letter-spacing: 3px; background: #fff; border: 1px solid #D9DCE5;
            border-radius: 10px; padding: 14px 20px; display: inline-block; margin: 10px 0; }
    a { color: #B5473C; }
  </style>
</head>
<body>
  <h1>Ayma</h1>
  <p class="tagline">She finds your person.</p>
  <p>A friend invited you to Ayma. Install the app, and when you create your
  account enter this referral code:</p>
  <p><span class="code" id="code"></span></p>
  <p id="nocode" hidden>This invite link is missing its code — ask your friend
  to resend it.</p>
  <script>
    // /r/{CODE} is rewritten here by Firebase Hosting; the code is the last
    // path segment.
    var seg = location.pathname.replace(/\/+$/, '').split('/').pop();
    var code = (seg && seg.toLowerCase() !== 'r') ? decodeURIComponent(seg) : '';
    if (code) {
      document.getElementById('code').textContent = code.toUpperCase();
    } else {
      document.getElementById('code').hidden = true;
      document.getElementById('nocode').hidden = false;
    }
  </script>
</body>
</html>
