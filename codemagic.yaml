# Codemagic CI — build, sign and ship both mobile apps with no Mac.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# The Flutter project lives in `ayma_flutter/`, so every workflow sets
# `working_directory: ayma_flutter`. The Cloud Run backend (functions/) is
# untouched by this file.
#
#   android-firebase  → signed release APK → Firebase App Distribution
#   ios-testflight    → signed release IPA → TestFlight
#
# Both are manual-only (no `triggering:` block) — Android is built and
# installed locally instead, and iOS is only run on request, via the
# Codemagic UI (Start new build → pick the workflow) or its API.
#
# ══════════════════════ ONE-TIME SETUP (all in a browser) ══════════════════════
#
# A. CODemagic app
#    - Connect this Git repo to a Codemagic application.
#
# B. ANDROID — Firebase App Distribution
#    1. Firebase console → ayma-ai → App Distribution → get started. Under
#       "Testers & Groups" make a group; put its name in FIREBASE_TESTER_GROUPS
#       below (default: "testers"). Add your Google account to it.
#    2. On the Pixel, install "App Tester" (Play Store) or just open the build
#       invite email — first build has to be accepted from the email link.
#    3. Service account for CI:
#       GCP console → IAM & Admin → Service Accounts (project ayma-ai) →
#       Create → grant role **Firebase App Distribution Admin** → Keys → Add key
#       → JSON → download.
#    4. Codemagic → app settings → Environment variables → group
#       `firebase_credentials`:
#         - FIREBASE_SERVICE_ACCOUNT   secure   paste the WHOLE JSON file content
#    5. Upload key (release signing):
#       Generate once on this Linux box (keytool ships with the JDK):
#         keytool -genkey -v -keystore ~/ayma-upload.jks -storetype JKS \
#           -keyalg RSA -keysize 2048 -validity 10000 -alias upload
#       Codemagic → app settings → Code signing identities → Android keystores →
#       upload ~/ayma-upload.jks, set alias/passwords, reference name
#       **ayma_upload_keystore** (matches `android_signing:` below). Keep the .jks
#       + passwords backed up somewhere safe — losing it means a new app entry.
#       (Local release builds read android/key.properties instead — see
#       docs/ANDROID_DEPLOY.md. That file and *.jks are gitignored.)
#
# C. iOS — TestFlight
#    1. Apple Developer Program ($99/yr). App ID `com.ayma.aymaFlutter` with
#       Push Notifications + Sign In with Apple. See docs/IOS_DEPLOY.md for the
#       full portal walk-through.
#    2. App Store Connect → create the app record → note its numeric "Apple ID".
#    3. App Store Connect API key (.p8 + Key ID + Issuer ID):
#       Codemagic → Team settings → Integrations → App Store Connect → add it,
#       name the integration and put that name in `integrations.app_store_connect`
#       below (currently: CODEMAGIC_ASC_API_KEY).
#    4. Codemagic → app settings → Environment variables → group
#       `appstore_credentials`:
#         - APP_STORE_APP_ID   plain   the numeric Apple ID from step 2
#         - GOOGLE_SERVICE_INFO_PLIST_B64   secure   OPTIONAL — base64 of
#             ios/Runner/GoogleService-Info.plist, only if you don't commit it.
#             Generate: base64 -i ios/Runner/GoogleService-Info.plist
#    5. `fetch-signing-files --create` in the workflow makes the distribution
#       cert + App Store provisioning profile on the first run.
# ══════════════════════════════════════════════════════════════════════════════

workflows:

  # ─────────────────────────────  ANDROID  ─────────────────────────────
  android-firebase:
    name: Android · build & ship to Firebase App Distribution
    max_build_duration: 60
    instance_type: linux
    working_directory: ayma_flutter

    environment:
      # Keep in step with local dev (`flutter --version` → 3.47.5 / Dart 3.13.4).
      # TODO: bump when you upgrade Flutter locally.
      flutter: 3.47.5
      java: 17                      # AGP 8.9.1 / Gradle needs JDK 17 to run
      groups:
        - firebase_credentials      # TODO: create (setup B.4)
      android_signing:
        - ayma_upload_keystore      # TODO: must match the keystore reference (setup B.5)
      vars:
        # Firebase → Project settings → your apps → the Android app.
        FIREBASE_ANDROID_APP_ID: "1:235381544962:android:99993490ed0aee69c4ef1b"
        FIREBASE_TESTER_GROUPS: "testers"   # TODO: match the group from setup B.1

    # Manual-only: Android is built and installed locally (adb) instead.
    # Trigger this workflow by hand in Codemagic (Start new build) if ever
    # needed as a backup path.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Build signed release APK
        script: |
          set -e
          # google-services.json is committed, so no decode step is needed.
          # Sentry (optional): SENTRY_DSN is a secure variable in this workflow's
          # variable group; unset = Sentry off. SENTRY_ENABLED=false is the
          # compile-time kill switch. The runtime flag is Firestore
          # app_config/sentry. Never commit the DSN.
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          test -n "$REVENUECAT_ANDROID_KEY" || { echo "REVENUECAT_ANDROID_KEY is not set"; exit 1; }
          flutter build apk --release \
            --dart-define=REVENUECAT_ANDROID_KEY="$REVENUECAT_ANDROID_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENABLED="${SENTRY_ENABLED:-true}" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=SENTRY_RELEASE="ayma@$VERSION_NAME+$PROJECT_BUILD_NUMBER" \
            --dart-define=SENTRY_DIST="$PROJECT_BUILD_NUMBER" \
            --build-number=$PROJECT_BUILD_NUMBER
          # Guard: fail if the APK came out debug-signed — that means the
          # CM_KEYSTORE_* env vars never reached Gradle (keystore not attached to
          # this workflow, or the reference name is wrong). Release APKs carry
          # only a v2/v3 signature, so read it with apksigner, not keytool.
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "ERROR: $APK is debug-signed — CM_KEYSTORE_* not set (check android_signing:)" >&2
            exit 1
          fi
          echo "OK: release-signed"

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/mapping/**/mapping.txt

    publishing:
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers               # TODO: match FIREBASE_TESTER_GROUPS
          artifact_type: apk
      email:
        recipients:
          - suhailps@gmail.com      # TODO: your address, or delete this block
        notify:
          success: true
          failure: true

  # ──────────────────────────────  iOS  ──────────────────────────────
  ios-testflight:
    name: iOS · build & upload to TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: ayma_flutter

    environment:
      flutter: 3.47.5              # TODO: keep in step with the Android workflow
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials     # TODO: create (setup C.4)
      vars:
        BUNDLE_ID: "com.ayma.aymaFlutter"
        # APP_STORE_APP_ID comes from the appstore_credentials group.

    integrations:
      # TODO: exact name of the App Store Connect API key integration (setup C.3).
      app_store_connect: CODEMAGIC_ASC_API_KEY_ADMIN

    # Manual-only, on request: trigger via the Codemagic API/UI (Start new
    # build) whenever an iOS TestFlight build is actually wanted, not on
    # every push.
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: main
    #       include: true

    scripts:
      - name: Provide GoogleService-Info.plist
        script: |
          set -e
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "Using committed ios/Runner/GoogleService-Info.plist"
          elif [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Wrote ios/Runner/GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST_B64"
          else
            echo "ERROR: no GoogleService-Info.plist committed and GOOGLE_SERVICE_INFO_PLIST_B64 is unset." >&2
            exit 1
          fi

      - name: Flutter pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze

      - name: Test
        script: flutter test

      - name: Pod install
        script: |
          set -e
          cd ios && pod install --repo-update

      - name: Set up code signing (automatic, no local Keychain)
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter build IPA
        script: |
          set -e
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((BUILD_NUMBER + 1))
          # Sentry (optional): SENTRY_DSN is a secure variable in this workflow's
          # variable group; unset = Sentry off. SENTRY_ENABLED=false is the
          # compile-time kill switch. The runtime flag is Firestore
          # app_config/sentry. Never commit the DSN.
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          test -n "$REVENUECAT_IOS_KEY" || { echo "REVENUECAT_IOS_KEY is not set"; exit 1; }
          flutter build ipa --release \
            --dart-define=REVENUECAT_IOS_KEY="$REVENUECAT_IOS_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_ENABLED="${SENTRY_ENABLED:-true}" \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --dart-define=SENTRY_RELEASE="ayma@$VERSION_NAME+$BUILD_NUMBER" \
            --dart-define=SENTRY_DIST="$BUILD_NUMBER" \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal testers"     # TODO: match a TestFlight group, or delete
      email:
        recipients:
          - suhailps@gmail.com     # TODO: your address, or delete this block
        notify:
          success: true
          failure: true
