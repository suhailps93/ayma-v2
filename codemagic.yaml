# Codemagic CI — build, sign and ship the iOS app to TestFlight with no Mac.
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# The Flutter project lives in the `ayma_flutter/` subdirectory of this repo, so
# every workflow sets `working_directory: ayma_flutter`. The Cloud Run backend
# (functions/) is untouched by this file.
#
# ─────────────────────────  ONE-TIME SETUP IN THE CODEMAGIC WEB UI  ─────────────
# 1. Connect this Git repo to a Codemagic app.
# 2. Team settings → Integrations → App Store Connect: add an API key. You need
#    the .p8 key file, its Key ID, and the Issuer ID (App Store Connect → Users
#    and Access → Integrations → App Store Connect API). Give the integration a
#    name and put that name in `integrations.app_store_connect` below
#    (currently: CODEMAGIC_ASC_API_KEY  ← TODO rename to match).
# 3. App settings → Environment variables: create a group called
#    `appstore_credentials` (referenced under `environment.groups`). Add:
#      - APP_STORE_APP_ID            plain   numeric "Apple ID" of the app record
#                                            (App Store Connect → your app → App
#                                            Information → General Information).
#      - GOOGLE_SERVICE_INFO_PLIST_B64  secure  OPTIONAL. base64 of
#            ios/Runner/GoogleService-Info.plist. Only needed if you do NOT
#            commit that file. (Android's google-services.json is already
#            committed in this repo, so committing the iOS plist is consistent
#            and lets you delete the decode step below.)
#            Generate with:  base64 -i ios/Runner/GoogleService-Info.plist
# 4. Bundle id `com.ayma.aymaFlutter` must already exist as an App ID in the
#    Apple Developer portal with Push Notifications + Sign In with Apple enabled,
#    and the app record must exist in App Store Connect. Codemagic's
#    `fetch-signing-files --create` will create the signing certificate and a
#    matching App Store provisioning profile for you.
# ───────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: iOS · build & upload to TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    working_directory: ayma_flutter

    environment:
      # Keep in sync with the toolchain the Android build uses. Local dev is on
      # Flutter 3.32.6 / Dart 3.8.1 (see `flutter --version`).
      # TODO: bump when you upgrade Flutter locally.
      flutter: 3.32.6
      xcode: latest
      cocoapods: default
      groups:
        - appstore_credentials          # TODO: create this group (see setup #3)
      vars:
        BUNDLE_ID: "com.ayma.aymaFlutter"
        # APP_STORE_APP_ID comes from the `appstore_credentials` group (setup #3).

    integrations:
      # TODO: rename to the exact App Store Connect API key integration name you
      # created in Team settings → Integrations (setup #2).
      app_store_connect: CODEMAGIC_ASC_API_KEY

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # A pushed build goes straight to TestFlight internal testers. Narrow this
      # (e.g. tag-only) once the loop is noisy.

    scripts:
      - name: Provide GoogleService-Info.plist
        script: |
          set -e
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "Using committed ios/Runner/GoogleService-Info.plist"
          elif [ -n "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "Wrote ios/Runner/GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST_B64"
          else
            echo "ERROR: no GoogleService-Info.plist committed and GOOGLE_SERVICE_INFO_PLIST_B64 is unset." >&2
            exit 1
          fi

      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          set -e
          cd ios && pod install --repo-update

      - name: Set up code signing (automatic, no local Keychain)
        script: |
          set -e
          keychain initialize
          # Creates/downloads the distribution cert + an App Store provisioning
          # profile for BUNDLE_ID, using the App Store Connect API integration.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Writes /Users/builder/export_options.plist and points the Xcode
          # project at the fetched profile.
          xcode-project use-profiles

      - name: Flutter build IPA
        script: |
          set -e
          # Monotonic build number = (highest build already on TestFlight) + 1.
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((BUILD_NUMBER + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # TODO: match an existing TestFlight internal group name, or delete
        # `beta_groups` to just push the build without assigning a group.
        beta_groups:
          - "Internal testers"
      email:
        # TODO: set your address, or remove this block.
        recipients:
          - suhailps@gmail.com
        notify:
          success: true
          failure: true
